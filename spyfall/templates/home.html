{% extends "layout.html" %}
{% block body %}
<div class="center-page">
  <div class="hero">
    <div class="brand">
      <span class="logo">🕵️</span>
      <div><b>스파이폴</b><small>질문하고 대답하며 스파이 찾기 게임</small></div>
    </div>
    <form class="panel" method="get" action="{{ url_for('home') }}" style="padding:22px">
      {% if error %}<div class="error-box">{{ error }}</div>{% endif %}
      <div class="field">
        <label for="code">게임 코드</label>
        <input class="input" id="code" name="code" placeholder="선생님 화면에 보이는 코드" autocomplete="off" required>
      </div>
      <button class="btn primary block" type="submit">입장하기</button>
    </form>
    <div class="foot-link"><a class="link" href="{{ url_for('teacher_new') }}">선생님이신가요? 새 게임 만들기 →</a></div>
  </div>
</div>
{% endblock %}
